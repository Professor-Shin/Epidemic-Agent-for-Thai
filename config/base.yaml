# Thai-context GABM-SEIR: base configuration
# Every number here is also listed in data/parameter_sources.csv with its source and status
# (data | literature | assumption). Change values here, never inside notebooks.

project: ThaiGABM-SEIR

population:
  N: 1000000                 # synthetic province-scale population (assumption, not a real province)
  initial_exposed_frac: 0.002
  initial_infectious_frac: 0.002
  initial_recovered_frac: 0.0

disease:                     # Aoki & Ghaffarzadegan (2026), see 04_อธิบายตัวแปรและค่าสถิติ.md
  beta0: 0.2                 # per day
  latent_days: 4             # sigma = 1/latent_days per day
  infectious_days: 10        # gamma = 1/infectious_days per day
  symptomatic_frac: 0.7      # share of infectious agents who notice symptoms (assumption)

sim:
  days: 30                   # pilot length (guideline section 11, phase 4)
  n_agents: 40
  seeds: [1, 2, 3]
  persona_seed: 2026

personas:
  marginals: config/persona_marginals.csv   # occupation groups and shares (status column says data or assumption)
  file: config/personas.csv                 # generated by notebook 00, editable
  age_groups: {"20-29": 0.21, "30-39": 0.21, "40-49": 0.25, "50-64": 0.33}   # replaced by Prem/UN pop 2020 in notebook 00
  household_size: {"1": 0.15, "2": 0.25, "3": 0.25, "4": 0.20, "5+": 0.15}  # assumption, replace with Census 2020
  p_high_risk_member: 0.35          # lives with an elderly or chronically ill person (assumption)
  risk_perception: {low: 0.3, medium: 0.4, high: 0.3}   # assumption
  trust_health_info: {low: 0.2, medium: 0.4, high: 0.4} # assumption

actions:
  stay_home: "stay home or work from home today"
  work_onsite: "go to your workplace or school in person"
  essential_errand: "go out only for essential shopping or errands"
  visit_family: "visit relatives or meet another household"

contacts:
  file: data/processed/contact_by_location_TH.csv   # built by notebook 00 (Prem et al. 2021)
  column: adult_20_64
  employment_rate: 0.67      # converts all-adult work contacts to per-worker contacts (assumption, replace with NSO LFS)
  f_work_other: 0.3          # share of "other" contacts that happen on a work day (commute, lunch)
  f_errand: 0.5              # share of "other" contacts on an errand day
  f_visit: 0.3               # share of "other" contacts on a visit day
  f_visit_home: 0.5          # contacts in the visited household, relative to own home contacts
  baseline_mix:              # assumed action mix on a normal pre-epidemic day; must sum to 1
    stay_home: 0.20
    work_onsite: 0.55
    essential_errand: 0.15
    visit_family: 0.10

policy:
  k: 0.8                     # policy effectiveness (Aoki & Ghaffarzadegan)
  alpha: 5.0e-4              # behavioural sensitivity for rule-based condition B
  leader_every_days: 7
  initial_level: open
  levels:                    # d = restriction intensity 0..1; check against OxCGRT THA in notebook 00
    open:
      d: 0.0
      text: "No restrictions. Normal activities are allowed."
      banned: []
    limited:
      d: 0.4
      text: "Gatherings are limited, employers are asked to allow work from home, masks are required in public places."
      banned: []
    strict:
      d: 0.8
      text: "Stay-at-home advisory: only essential work and essential errands are allowed. Visits to other households are not allowed."
      banned: [visit_family]

llm:
  backend: transformers      # transformers (4-bit, works on a T4) | vllm (optional, faster) | mock (no GPU, for testing)
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 64
  batch_size: 40
  max_prompt_tokens: 1024
  retry_invalid: 1
  models:
    typhoon8b:               # Thai-tuned (SCB10X), based on Llama 3.1 8B; fits a T4 at 4-bit, needs transformers>=4.45
      hf_id: scb10x/llama3.1-typhoon2-8b-instruct
      vllm_id: null
      gated: false
    qwen7b:
      hf_id: Qwen/Qwen2.5-7B-Instruct
      vllm_id: Qwen/Qwen2.5-7B-Instruct-AWQ
      gated: false
    llama8b:
      hf_id: meta-llama/Llama-3.1-8B-Instruct
      vllm_id: hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4
      gated: true            # accept the licence on Hugging Face and add HF_TOKEN to Colab secrets
    mistral7b:               # backup if llama8b is not accessible
      hf_id: mistralai/Mistral-7B-Instruct-v0.3
      vllm_id: null
      gated: false
    qwen1_5b:                # fast debug model
      hf_id: Qwen/Qwen2.5-1.5B-Instruct
      vllm_id: null
      gated: false
  compare: [qwen7b, typhoon8b]

sensitivity:                 # notebook 04
  w_home_scale: [0.5, 1.0, 1.5]       # scales home contacts
  f_errand: [0.3, 0.5, 0.7]
  f_visit: [0.15, 0.3, 0.5]
  wfh_scale: [0.5, 1.0, 1.5]          # scales the probability that a persona can work from home
