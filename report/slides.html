<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GABM-SEIR บริบทไทย</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f0efec; --fg:#0b0b0b; --fg-2:#52514e;
  --muted:#898781; --border:rgba(11,11,11,.12); --grid:#e1e0d9;
  --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --gray:#898781; --violet:#6250d6;
  --good:#0ca30c; --crit:#d03b3b;
  --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322; --fg:#f0efec; --fg-2:#c3c2b7;
  --muted:#898781; --border:rgba(255,255,255,.14); --grid:#2c2c2a;
  --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --gray:#9a988f; --violet:#9085e9;
  --good:#0ca30c; --crit:#e46060;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322; --fg:#f0efec; --fg-2:#c3c2b7;
  --muted:#898781; --border:rgba(255,255,255,.14); --grid:#2c2c2a;
  --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --gray:#9a988f; --violet:#9085e9;
  --good:#0ca30c; --crit:#e46060;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;
     -webkit-font-smoothing:antialiased}

/* ---- deck chrome -------------------------------------------------------- */
#deck{position:relative;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;display:none;flex-direction:column;
       padding:clamp(20px,3.2vw,52px) clamp(20px,4vw,70px) 62px;background:var(--bg)}
.slide.on{display:flex}
.slide h1{font-size:clamp(26px,3.6vw,46px);line-height:1.22;margin:0 0 .35em;font-weight:700;letter-spacing:-.01em}
.slide h2{font-size:clamp(19px,2.3vw,30px);line-height:1.3;margin:0 0 .5em;font-weight:600}
.kicker{font:500 clamp(11px,1.15vw,14px)/1.3 var(--mono);letter-spacing:.09em;
        text-transform:uppercase;color:var(--muted);margin:0 0 .9em}
/* `safe center` centres short slides but falls back to top-alignment when the content
   overflows, so nothing is ever clipped above the scroll area. */
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:safe center;
      gap:clamp(10px,1.4vw,20px);font-size:clamp(13px,1.35vw,18px);color:var(--fg-2);overflow:auto}
.body strong{color:var(--fg);font-weight:600}
.lead{font-size:clamp(15px,1.7vw,22px);color:var(--fg-2);max-width:60ch}
ul{margin:0;padding-left:1.25em}
li{margin:.34em 0}
li::marker{color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:.92em;background:var(--surface-2);
           padding:.08em .34em;border-radius:4px}
.nav{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;
     gap:14px;padding:0 clamp(20px,4vw,70px);border-top:1px solid var(--border);
     background:var(--surface);font-size:13px;color:var(--muted)}
.nav .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button{font:inherit;font-family:var(--font);color:var(--fg-2);background:var(--surface-2);
            border:1px solid var(--border);border-radius:7px;padding:5px 12px;cursor:pointer}
.nav button:hover{background:var(--bg)}
.bar{position:absolute;left:0;bottom:52px;height:3px;background:var(--blue);transition:width .18s ease}

/* ---- pieces ------------------------------------------------------------- */
.cols{display:grid;gap:clamp(12px,1.8vw,26px);grid-template-columns:repeat(var(--n,2),minmax(0,1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
      padding:clamp(12px,1.3vw,18px)}
.card h3{margin:0 0 .35em;font-size:clamp(13px,1.3vw,17px);font-weight:600;color:var(--fg)}
.card p{margin:.2em 0;font-size:clamp(12px,1.2vw,15px)}
/* figures are rendered on the light chart surface #fcfcfb with a validated palette,
   so they keep that surface in both themes rather than being inverted. */
.fig{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
     background:#fcfcfb;border:1px solid var(--border);border-radius:12px;padding:10px}
.fig img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.cap{font-size:clamp(11px,1.05vw,13px);color:var(--muted);margin:.5em 0 0}
table{border-collapse:collapse;width:100%;font-size:clamp(11.5px,1.15vw,15px)}
th,td{text-align:left;padding:.42em .6em;border-bottom:1px solid var(--grid)}
th{color:var(--muted);font-weight:500;font-size:.92em}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.hi td{background:var(--surface-2)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:clamp(24px,3.4vw,46px);font-weight:700;line-height:1;color:var(--fg);
         font-variant-numeric:tabular-nums}
.stat .l{font-size:clamp(11.5px,1.15vw,14px);color:var(--muted)}
.neg{color:var(--blue)} .pos{color:var(--orange)}
.chip{display:inline-block;font:500 11.5px/1 var(--mono);padding:4px 8px;border-radius:999px;
      background:var(--surface-2);color:var(--fg-2);border:1px solid var(--border)}
.rule{height:1px;background:var(--border);margin:.2em 0}
.k{color:var(--fg);font-weight:600}
.flow{display:flex;align-items:center;gap:clamp(6px,1vw,14px);flex-wrap:wrap}
.flow .b{background:var(--surface);border:1px solid var(--border);border-radius:10px;
         padding:clamp(8px,1vw,14px) clamp(10px,1.2vw,18px);font-size:clamp(12px,1.2vw,15px);
         text-align:center;color:var(--fg)}
.flow .a{color:var(--muted);font-size:clamp(14px,1.6vw,20px)}
.eq{font-family:var(--mono);font-size:clamp(13px,1.5vw,19px);background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:.8em 1em;color:var(--fg);overflow-x:auto}
.title-slide{justify-content:center}
.title-slide h1{font-size:clamp(30px,4.6vw,62px);max-width:22ch}
.sub{font-size:clamp(15px,1.9vw,24px);color:var(--fg-2);max-width:48ch;margin:.2em 0 1.4em}
.meta{font-size:clamp(12px,1.2vw,15px);color:var(--muted)}
.two-line{font-size:clamp(16px,2vw,26px);color:var(--fg);font-weight:600;max-width:40ch}
</style>
</head>
<body>
<div id="deck"></div>
<div class="bar" id="bar"></div>
<div class="nav">
  <span class="mono" id="num">1 / 1</span>
  <span class="t" id="ttl"></span>
  <button id="theme" title="สลับโหมดสว่าง/มืด">โหมด</button>
  <button id="prev">←</button>
  <button id="next">→</button>
</div>

<template id="slides">

<section class="slide title-slide" data-title="หน้าปก">
  <p class="kicker">Bioinformatics term project · 2569</p>
  <h1>เมื่อการจูนภาษาไทยไม่ได้ทำให้ LLM จำลองคนไทยได้ดีขึ้นเสมอไป</h1>
  <p class="sub">การออกแบบ 2×2 เพื่อแยกผลของการแปลท้องถิ่นออกจากตระกูลโมเดล
     ในแบบจำลอง GABM-SEIR ของจังหวัดสังเคราะห์ในประเทศไทย</p>
  <p class="meta">โมเดล 5 ตัว · เงื่อนไข 4 แบบ · 3 seeds · การตัดสินใจของ LLM 216,000 ครั้ง</p>
</section>

<section class="slide" data-title="คำถาม">
  <p class="kicker">1 · คำถาม</p>
  <h1>ถ้าจะใช้ LLM จำลองคนไทย ควรใช้โมเดลที่จูนภาษาไทยไหม</h1>
  <div class="body">
    <p class="lead">GABM คือแบบจำลองที่ให้ LLM เป็นผู้ตัดสินใจแทน agent แต่ละตัว แทนการเขียนกฎตายตัว
       งานเกือบทั้งหมดพัฒนาและตรวจสอบในบริบทตะวันตก</p>
    <div class="cols" style="--n:2">
      <div class="card">
        <h3>ทางเลือกที่ดูเป็นธรรมชาติที่สุด</h3>
        <p>เปลี่ยนไปใช้โมเดลที่จูนด้วยภาษาและข้อมูลไทย เช่น Typhoon หรือ OpenThaiGPT
           แล้วสมมติว่าพฤติกรรมจะ "ไทยขึ้น"</p>
      </div>
      <div class="card">
        <h3>ปัญหาที่ยังไม่มีใครตอบ</h3>
        <p>สมมติฐานนี้ยังไม่เคยถูกทดสอบ และการเปรียบเทียบโมเดลจูนกับไม่จูนมัก
           <strong>ข้ามตระกูลโมเดลไปพร้อมกัน</strong> จึงแยกสองปัจจัยไม่ออก</p>
      </div>
    </div>
    <div class="rule"></div>
    <p class="two-line">คำถามของโครงงานนี้ — ผลที่เห็นเป็นของ <span class="neg">การจูนภาษา</span>
       หรือเป็นของ <span class="pos">โมเดลฐาน</span> ที่บังเอิญถูกเลือกมา</p>
  </div>
</section>

<section class="slide" data-title="งานที่เกี่ยวข้อง">
  <p class="kicker">2 · งานที่เกี่ยวข้อง</p>
  <h1>สามงานที่โครงงานนี้ต่อยอด</h1>
  <div class="body">
    <table>
      <tr><th>งาน</th><th>ทำอะไร</th><th>ช่องว่างที่เหลือไว้</th></tr>
      <tr><td class="k">Williams et al. (2023)</td>
          <td>GABM ตัวแรกของโรคระบาด พฤติกรรมตอบสนองต่อสุขภาพตัวเองและข่าวเคส</td>
          <td>ไม่มี baseline พฤติกรรมวันปกติที่อ้างอิงได้ ตีความว่า "ดีขึ้น" เทียบกับอะไรไม่ชัด</td></tr>
      <tr><td class="k">Ferencz et al. (2026) · Epi-LLM</td>
          <td>ถามว่าพฤติกรรมที่เห็นเป็นของประเทศไหน ทดสอบด้วยป้ายกำกับประเทศใน prompt</td>
          <td>ป้ายกำกับเป็นการแทรกแซงที่อ่อนที่สุด ยังไม่มีใครทดสอบระดับน้ำหนักโมเดล</td></tr>
      <tr><td class="k">Aoki &amp; Ghaffarzadegan (2026)</td>
          <td>ผู้นำ LLM ตั้งนโยบายรายสัปดาห์ พบ policy inertia สูงมาก</td>
          <td>ประชาชนเป็นสมการ จึงแยกไม่ออกว่าผลมาจากผู้นำหรือประชาชน</td></tr>
    </table>
    <div class="rule"></div>
    <p>ทั้งสามงาน <strong>ไม่ได้รายงานการตรวจ position bias</strong> ของชุดตัวเลือกใน prompt
       ซึ่งเป็นการทดสอบที่ราคาถูกมากแต่เปลี่ยนความหมายของตัวเลขได้ทั้งหมด</p>
  </div>
</section>

<section class="slide" data-title="การออกแบบ 2×2">
  <p class="kicker">3 · การออกแบบ</p>
  <h1>แยกสองปัจจัยด้วยแผง 2×2</h1>
  <div class="body">
    <div class="cols" style="--n:2">
      <div>
        <table>
          <tr><th></th><th>โมเดลฐาน</th><th>จูนไทย</th></tr>
          <tr><td class="k">Llama 3.1 8B</td><td><code>llama8b</code></td><td><code>typhoon8b</code></td></tr>
          <tr><td class="k">Qwen 2.5 7B</td><td><code>qwen7b</code></td><td><code>openthaigpt7b</code></td></tr>
        </table>
        <p class="cap">แต่ละแถวคือตระกูลเดียวกัน ต่างกันแค่การจูน — ผลของการจูนจึงอ่านได้ตรง ๆ
           จากส่วนต่างในแถว</p>
      </div>
      <div class="cols" style="--n:1">
        <div class="card"><h3><code>seallm7b</code> — ตัวควบคุมภูมิภาค</h3>
          <p>จูนภาษาเอเชียตะวันออกเฉียงใต้ ไม่เจาะจงไทย ใช้ตอบว่าการจูนระดับภูมิภาค
             ให้ผลเหมือนการจูนไทยหรือไม่</p></div>
        <div class="card"><h3>สิ่งที่ควบคุมให้เหมือนกันทุกโมเดล</h3>
          <p>prompt · persona · seed · ลำดับตัวเลือก · พารามิเตอร์โรค — เปลี่ยนเฉพาะน้ำหนักของโมเดล</p></div>
      </div>
    </div>
  </div>
</section>

<section class="slide" data-title="แบบจำลอง">
  <p class="kicker">4 · วิธีการ</p>
  <h1>LLM อยู่ในลูปของ SEIR ทุกวัน</h1>
  <div class="body">
    <div class="flow">
      <div class="b">สถานะ SEIR<br><span class="cap">วันที่ t</span></div><span class="a">→</span>
      <div class="b">prompt ต่อ agent<br><span class="cap">persona · อาการ · ยอดเคส · นโยบาย</span></div><span class="a">→</span>
      <div class="b">LLM เลือก 1 ใน 4 กิจกรรม</div><span class="a">→</span>
      <div class="b">q̄<sub>out</sub><br><span class="cap">ระดับการสัมผัสเทียบวันปกติ</span></div><span class="a">→</span>
      <div class="b">β<sub>eff</sub> → SEIR<br><span class="cap">วันที่ t+1</span></div>
    </div>
    <div class="cols" style="--n:2">
      <div>
        <h2>ประชากรและโรค</h2>
        <ul>
          <li>จังหวัดสังเคราะห์ N = 1,000,000 · agent 40 ตัวแทนประชากร</li>
          <li>β₀ = 0.2 · แฝง 4 วัน · แพร่เชื้อ 10 วัน → <strong>R₀ = 2.0</strong></li>
          <li>เมทริกซ์การสัมผัสของไทยจาก Prem et al. (2021) คอลัมน์ <code>adult_20_64</code></li>
          <li>persona สร้างจากสำมะโนและข้อมูลแรงงานไทย</li>
        </ul>
      </div>
      <div>
        <h2>สี่ตัวเลือกต่อวัน</h2>
        <ul>
          <li><code>stay_home</code> อยู่บ้านหรือทำงานจากบ้าน</li>
          <li><code>work_onsite</code> ไปทำงานหรือไปเรียน</li>
          <li><code>essential_errand</code> ออกไปทำธุระจำเป็น</li>
          <li><code>visit_family</code> ไปเยี่ยมญาติหรือข้ามครัวเรือน</li>
        </ul>
        <p class="cap">ตอบเป็น JSON พร้อมฟิลด์ <code>reason</code> ไม่เกิน 15 คำ ซึ่งกลายเป็นข้อมูลหลัก
           ของการวิเคราะห์กลไก</p>
      </div>
    </div>
  </div>
</section>

<section class="slide" data-title="พฤติกรรม → การสัมผัส">
  <p class="kicker">4 · วิธีการ</p>
  <h1>การเลือกกิจกรรมเข้าสู่สมการอย่างไร</h1>
  <div class="body">
    <div class="eq">β_eff = β₀ · [ w_home + (1 − w_home) · q̄_out · q_policy ]</div>
    <div class="cols" style="--n:3">
      <div class="card"><h3>w_home = 0.507</h3>
        <p>สัดส่วนการสัมผัสที่เกิดในบ้านในวันปกติ การอยู่บ้านจึงไม่เคยแปลว่าไม่มีการสัมผัสเลย</p></div>
      <div class="card"><h3>q̄_out</h3>
        <p>ระดับการสัมผัสนอกบ้านของประชากร <strong>เทียบกับวันปกติ</strong>
           ค่า 1 คือเท่าวันปกติ ต่ำกว่า 1 คือออกน้อยลง</p></div>
      <div class="card"><h3>q_policy</h3>
        <p>ตัวคูณจากระดับมาตรการ ใช้เฉพาะเงื่อนไข D ที่มีผู้นำ LLM</p></div>
    </div>
    <div class="rule"></div>
    <p><strong>จุดที่ต้องระวัง</strong> q̄_out วัดเทียบกับ <code>baseline_mix</code> ซึ่งเป็น
       <em>สมมติฐาน</em> ว่าวันปกติคนแบ่งกิจกรรมกันอย่างไร ไม่ใช่ข้อมูลที่วัดมา
       — เรากลับมาทดสอบประเด็นนี้ในสไลด์ความคงทน</p>
  </div>
</section>

<section class="slide" data-title="สี่เงื่อนไข">
  <p class="kicker">4 · วิธีการ</p>
  <h1>สี่เงื่อนไข จากไม่มีพฤติกรรมเลยถึงมีผู้นำ</h1>
  <div class="body">
    <table>
      <tr><th>เงื่อนไข</th><th>อะไรเป็นตัวกำหนดพฤติกรรม</th><th>บทบาท</th></tr>
      <tr><td class="k">A</td><td>ไม่มีเลย — SEIR ล้วน</td><td>ตรวจว่าแกนกลไกโรคถูกต้อง</td></tr>
      <tr><td class="k">B</td><td>กฎ <code>m(t) = 1/(1 + α·cases7)</code></td><td>baseline แบบ rule-based ตาม Aoki &amp; Ghaffarzadegan</td></tr>
      <tr class="hi"><td class="k">C</td><td><strong>LLM เป็นประชาชน</strong> 40 agent × 4 ตัวเลือก</td><td>เงื่อนไขหลักของโครงงาน</td></tr>
      <tr class="hi"><td class="k">D</td><td>C + <strong>ผู้นำ LLM</strong> ตั้งระดับมาตรการรายสัปดาห์</td><td>ตอบ RQ3 เรื่องผู้นำ</td></tr>
    </table>
    <div class="cols" style="--n:4">
      <div class="stat"><span class="v">216,000</span><span class="l">การตัดสินใจของประชาชน</span></div>
      <div class="stat"><span class="v">390</span><span class="l">การตัดสินใจของผู้นำ</span></div>

<script>
const tpl = document.getElementById('slides');
const deck = document.getElementById('deck');
deck.append(...tpl.content.cloneNode(true).children);
const slides = [...deck.querySelectorAll('.slide')];
const bar = document.getElementById('bar'), num = document.getElementById('num'), ttl = document.getElementById('ttl');
let i = 0;
function show(n){
  i = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, k) => s.classList.toggle('on', k === i));
  bar.style.width = ((i + 1) / slides.length * 100) + '%';
  num.textContent = (i + 1) + ' / ' + slides.length;
  ttl.textContent = slides[i].dataset.title || '';
  try { location.hash = String(i + 1); } catch (e) {}
  deck.querySelector('.slide.on .body')?.scrollTo(0, 0);
}
document.getElementById('next').onclick = () => show(i + 1);
document.getElementById('prev').onclick = () => show(i - 1);
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(i + 1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(i - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
  else if (e.key === 'f') document.documentElement.requestFullscreen?.();
});
const t = document.getElementById('theme');
t.onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.getAttribute('data-theme') || (dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
};
show(parseInt(location.hash.slice(1), 10) - 1 || 0);
</script>
